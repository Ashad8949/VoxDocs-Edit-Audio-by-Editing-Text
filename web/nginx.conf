server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are whole media files, and a render can take a while.
    client_max_body_size 2048m;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://${VOXDOCS_API_HOST}:${VOXDOCS_API_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # stream large uploads straight through
        proxy_buffering off;           # and let range requests seek promptly
    }

    # Hashed assets never change; the entry point always must be revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
