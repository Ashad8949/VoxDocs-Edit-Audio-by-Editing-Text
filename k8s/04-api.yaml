# The API server: uploads, projects, and the ffmpeg render pipeline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxdocs-api
  namespace: voxdocs
  labels:
    app: voxdocs-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voxdocs-api
  template:
    metadata:
      labels:
        app: voxdocs-api
    spec:
      containers:
        - name: api
          image: ghcr.io/voxdocs/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: voxdocs-config
          volumeMounts:
            - name: media
              mountPath: /data
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              # Rendering is ffmpeg-bound and benefits from more than one core.
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
      # A render in flight should finish rather than be killed mid-file.
      terminationGracePeriodSeconds: 120
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: voxdocs-media
---
apiVersion: v1
kind: Service
metadata:
  name: voxdocs-api
  namespace: voxdocs
spec:
  selector:
    app: voxdocs-api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voxdocs-api
  namespace: voxdocs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voxdocs-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: voxdocs-api
  namespace: voxdocs
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: voxdocs-api
